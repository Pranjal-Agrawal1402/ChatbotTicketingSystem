{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="section" style="max-width:820px;">
  <div class="breadcrumb"><a href="{{ url_for('public.home') }}">Home</a> / {{ page.title }}</div>
  <div class="reveal info-card">
    <h1 class="font-display" style="color:var(--navy-deep); margin-bottom:18px;">{{ page.title }}</h1>
    <div style="color:var(--ink-dim); line-height:1.8; font-size:0.95rem;">{{ page.content|safe }}</div>
  </div>
</section>
{% endblock %}
