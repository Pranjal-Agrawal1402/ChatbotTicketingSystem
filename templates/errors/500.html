{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<section class="section" style="max-width:480px; text-align:center;">
  <div class="info-card">
    <div style="font-size:3rem;">⚠️</div>
    <h1 class="font-display" style="color:var(--navy-deep);">Something Went Wrong</h1>
    <p style="color:var(--ink-dim); margin-bottom:20px;">Our team has been notified. Please try again shortly.</p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to Home →</a>
  </div>
</section>
{% endblock %}
